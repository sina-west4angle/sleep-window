<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>催眠小窗 · 睡前听书</title>
<style>
  :root{--bg:#0e1220;--card:#171d33;--line:#26304f;--txt:#e8ecf8;--dim:#93a0c2;--acc:#8b7cf6}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:120px}
  header{padding:28px 18px 10px;max-width:760px;margin:0 auto}
  h1{font-size:24px;margin:0 0 6px} .sub{color:var(--dim);font-size:13px}
  .bar{max-width:760px;margin:12px auto 0;padding:0 18px;display:flex;gap:8px}
  input[type=search]{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font-size:14px;outline:none}
  main{max-width:760px;margin:0 auto;padding:8px 18px}
  h2{font-size:15px;color:var(--acc);margin:22px 0 8px}
  .track{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:7px 0;cursor:pointer}
  .track:hover{border-color:var(--acc)} .track.playing{border-color:var(--acc);background:#1d2440}
  .t{font-size:14px;line-height:1.45} .d{color:var(--dim);font-size:12px;white-space:nowrap}
  .msg{color:var(--dim);padding:30px 0;text-align:center;font-size:14px}
  #player{position:fixed;left:0;right:0;bottom:0;background:#121830f2;border-top:1px solid var(--line);backdrop-filter:blur(8px)}
  #player .in{max-width:760px;margin:0 auto;padding:10px 18px 14px}
  #now{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
  .row{display:flex;align-items:center;gap:10px}
  button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
  button.main{background:var(--acc);border-color:var(--acc);color:#fff;min-width:64px}
  select{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:13px}
  input[type=range]{flex:1;accent-color:var(--acc)} .time{font-size:12px;color:var(--dim);min-width:86px;text-align:right}
</style>
</head>
<body>
<header>
  <h1>🌙 催眠小窗</h1>
  <div class="sub" id="sub">睡前听书 · 书架加载中…</div>
</header>
<div class="bar"><input type="search" id="q" placeholder="搜书名 / 章节…"></div>
<main id="list"><div class="msg">正在从书架取书…</div></main>

<div id="player"><div class="in">
  <div id="now">还没选书，点任意一集开始听</div>
  <div class="row">
    <button id="prev">⏮</button>
    <button id="play" class="main">播放</button>
    <button id="next">⏭</button>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <span class="time" id="time">0:00 / 0:00</span>
    <select id="speed"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
    <select id="timer"><option value="0">定时关</option><option value="15">15 分钟</option><option value="30">30 分钟</option><option value="45">45 分钟</option><option value="60">60 分钟</option></select>
  </div>
</div></div>
<audio id="a" preload="metadata"></audio>
<script>
const API = "https://ocqfhempmbxmriecijrg.supabase.co/functions/v1/sleep-window?catalog=1";
const listEl = document.getElementById('list'), subEl = document.getElementById('sub');
const audio = document.getElementById('a'), nowEl = document.getElementById('now');
const playBtn = document.getElementById('play'), seekEl = document.getElementById('seek'), timeEl = document.getElementById('time');
let tracks = [], cur = -1, sleepAt = null;
const fmt = s => { s = Math.max(0, Math.round(s||0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const bookOf = t => { const m = (t||'').match(/《([^》]+)》/); return m ? m[1] : '其他'; };
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\r?\n/g,' ');
function render(filter=''){
  const f = filter.trim();
  const groups = new Map();
  tracks.forEach((t,i)=>{ if(f && !t.title.includes(f)) return; const b = bookOf(t.title); if(!groups.has(b)) groups.set(b,[]); groups.get(b).push(i); });
  if(!groups.size){ listEl.innerHTML = '<div class="msg">没找到</div>'; return; }
  let out = '';
  groups.forEach((idxs, b) => {
    out += '<h2>《' + esc(b) + '》 · ' + idxs.length + ' 集</h2>';
    idxs.forEach(i => { out += '<div class="track' + (i===cur ? ' playing' : '') + '" data-i="' + i + '"><span class="t">' + esc(tracks[i].title) + '</span><span class="d">' + fmt(tracks[i].duration_sec) + '</span></div>'; });
  });
  listEl.innerHTML = out;
  listEl.querySelectorAll('.track').forEach(el => el.onclick = () => play(+el.dataset.i));
}
function play(i){
  if(i<0 || i>=tracks.length) return;
  cur = i; audio.src = tracks[i].file_url; audio.playbackRate = +document.getElementById('speed').value;
  audio.play(); nowEl.textContent = '正在听：' + tracks[i].title; render(document.getElementById('q').value);
}
playBtn.onclick = () => { if(cur<0){ if(tracks.length) play(0); return; } audio.paused ? audio.play() : audio.pause(); };
document.getElementById('prev').onclick = () => play(cur-1);
document.getElementById('next').onclick = () => play(cur+1);
document.getElementById('speed').onchange = e => audio.playbackRate = +e.target.value;
document.getElementById('timer').onchange = e => { const m = +e.target.value; sleepAt = m ? Date.now() + m*60000 : null; };
audio.onplay = () => playBtn.textContent = '暂停';
audio.onpause = () => playBtn.textContent = '播放';
audio.onended = () => play(cur+1);
audio.ontimeupdate = () => {
  if(audio.duration) seekEl.value = Math.round(audio.currentTime / audio.duration * 1000);
  timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration || (cur>=0 ? tracks[cur].duration_sec : 0));
  if(sleepAt && Date.now() > sleepAt){ audio.pause(); sleepAt = null; document.getElementById('timer').value = '0'; }
};
seekEl.oninput = () => { if(audio.duration) audio.currentTime = seekEl.value/1000 * audio.duration; };
document.getElementById('q').oninput = e => render(e.target.value);
fetch(API).then(r => r.json()).then(d => {
  tracks = d.tracks || [];
  subEl.textContent = '睡前听书 · 共 ' + tracks.length + ' 集 · 书架实时同步，新书自动出现';
  render();
}).catch(() => { listEl.innerHTML = '<div class="msg">书架加载失败，过一会儿刷新试试</div>'; });
</script>
</body>
</html>
